location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Owner questions go straight to the AI service (read-only; it has no token and cannot change data).
location = /api/v1/chat {
    proxy_pass http://ai:8080/v1/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
}

# Contract upload -> text (PDF text layer, OCR for scans). Read-only, nothing is stored.
location = /api/v1/documents/extract {
    proxy_pass http://ai:8080/v1/documents/extract;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    client_max_body_size 16m;
}

location /api/v1/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}

location /assets/ {
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
