<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vero</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme (or the system one) and the accessibility settings (src/lib/a11y.ts)
      // before the first paint, so the page never flashes the default theme, text size or contrast.
      (function () {
        var root = document.documentElement;
        var t = null;
        try { t = localStorage.getItem("vero-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        root.dataset.theme = t;
        try {
          var a = JSON.parse(localStorage.getItem("vero-a11y") || "null") || {};
          root.dataset.textSize = a.textSize === "large" || a.textSize === "xlarge" ? a.textSize : "normal";
          if (a.highContrast === true) root.dataset.contrast = "high";
          if (a.colorBlind === true) root.dataset.colorblind = "on";
          if (a.reduceMotion === true) root.dataset.motion = "reduce";
          root.dataset.keyboard = a.keyboard === true ? "on" : "off";
        } catch (e) {}
      })();
    </script>
    <style>
      /* Loading screen: shown instantly, before the app's JavaScript and CSS have loaded.
         The app fades it out (src/lib/bootSplash.ts) once the first data is in. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        background: #f3f4f7; color: #14213d;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      [data-theme="dark"] #boot-splash { background: #0e1a35; color: #f4f5f9; }
      #boot-splash.boot-splash-out { opacity: 0; visibility: hidden; }
      #boot-splash .mark { width: 96px; height: auto; overflow: visible; }
      #boot-splash .mark path { animation: boot-in 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      #boot-splash .mark path + path { animation-delay: 0.15s; --dx: 14px; }
      #boot-splash .mark { animation: boot-breathe 2.4s ease-in-out 0.9s infinite; }
      #boot-splash .name {
        position: absolute; left: 0; right: 0; bottom: 12vh;
        display: flex; flex-direction: column; align-items: center; gap: 14px;
        font: 600 28px/1 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: -0.02em;
        animation: boot-rise 0.6s ease 0.35s both;
      }
      #boot-splash .bar {
        position: relative; width: 72px; height: 3px; overflow: hidden; border-radius: 3px;
        background: currentColor; opacity: 0.15;
      }
      #boot-splash .bar::after {
        content: ""; position: absolute; inset: 0; width: 40%; border-radius: inherit;
        background: currentColor; animation: boot-bar 1.1s ease-in-out infinite;
      }
      [data-theme="dark"] #boot-splash .bar { opacity: 0.25; }
      @keyframes boot-in { from { opacity: 0; transform: translate(var(--dx, -14px), -14px); } to { opacity: 1; transform: none; } }
      @keyframes boot-breathe { 50% { transform: scale(1.04); } }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash, #boot-splash * , #boot-splash .bar::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Loading Vero">
      <svg class="mark" viewBox="0 3 372 281" fill="currentColor" aria-hidden="true">
        <path d="M2 4C70 3 128 26 162 78L242 206L196 282L52 50C36 26 18 8 2 4Z" />
        <path d="M286 4.5H368L255 187L214 121Z" />
      </svg>
      <div class="name" aria-hidden="true">
        <span>Vero</span>
        <span class="bar"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
