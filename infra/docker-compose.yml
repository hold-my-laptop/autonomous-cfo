services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      TZ: Europe/Warsaw
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build: ../services/api
    env_file: .env
    environment:
      STATEMENT_PATH: /opt/app-root/data/pizzeria-amalfi-bank-statement-2025-v6.csv
      AI_URL: http://ai:8080
    volumes:
      - ../data:/opt/app-root/data:ro
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    profiles: ["app"]
    build: ../services/ai
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8080/internal/v1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    profiles: ["app"]
    build: ../apps/web
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
