apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  labels:
    app: db
    app.kubernetes.io/part-of: vero
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Postgres data
    openshift.io/description: Database of the Vero api
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 5Gi
