apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: mlflow
  labels:
    app: mlflow
    app.kubernetes.io/part-of: vero
spec:
  runPolicy: Serial
  source:
    type: Dockerfile
    dockerfile: |
      FROM registry.access.redhat.com/ubi9/python-312:latest
      RUN pip install --no-cache-dir mlflow==3.18.0
      ENV HOME=/tmp MLFLOW_DISABLE_TELEMETRY=true DO_NOT_TRACK=true MLFLOW_DISABLE_AGENT_HINT=1
      USER 1001
      EXPOSE 8080
      CMD ["mlflow", "server", "--host", "0.0.0.0", "--port", "8080", "--workers", "1", "--allowed-hosts", "*", "--backend-store-uri", "sqlite:////data/mlflow.db", "--artifacts-destination", "/data/artifacts"]
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: mlflow:latest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  triggers: []
