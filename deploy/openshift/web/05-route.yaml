apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/part-of: vero
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
