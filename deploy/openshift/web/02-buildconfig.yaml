apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/part-of: vero
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/hold-my-laptop/autonomous-cfo.git
      ref: main
    contextDir: apps/web
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: web:latest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  triggers: []
