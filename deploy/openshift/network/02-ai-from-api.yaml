apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-from-api
  labels:
    app.kubernetes.io/part-of: vero
spec:
  podSelector:
    matchLabels:
      app: ai
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8080
