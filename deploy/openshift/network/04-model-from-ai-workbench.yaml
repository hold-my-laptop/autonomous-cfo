apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-from-ai-workbench
  labels:
    app.kubernetes.io/part-of: vero
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: vero-llm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ai
        - podSelector:
            matchLabels:
              notebook-name: cfo-notebook
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
      ports:
        - protocol: TCP
          port: 8080
