apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-router
  labels:
    app.kubernetes.io/part-of: vero
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8080
